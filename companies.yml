# Company job boards polled directly, grouped by ATS.
#
# Every token here was verified against the live API - a token that 404s is
# skipped at runtime with a debug log, but there is no reason to ship dead
# ones. Re-verify with `python main.py --check-boards` after editing.
#
# Two accepted forms per entry:
#   - token                      # display name derived from the token
#   - {token: t, name: Proper}   # display name given
#
# Greenhouse returns its own `company_name`, so names there are only a
# fallback. Lever and Ashby do not, so the name given here is what shows up in
# the digest - worth setting when the token reads badly.

