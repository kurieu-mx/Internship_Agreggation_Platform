# Company job boards polled directly, grouped by ATS.
#
# Every token here was verified against the live API - a token that 404s is
# skipped at runtime with a debug log, but there is no reason to ship dead
# ones. Re-verify with `python main.py --check-boards` after editing.
#
# Two accepted forms per entry:
#   - token                      # display name derived from the token
#   - {token: t, name: Proper}   # display name given
#
# Greenhouse returns its own `company_name`, so names there are only a
# fallback. Lever and Ashby do not, so the name given here is what shows up in
# the digest - worth setting when the token reads badly.

greenhouse:
  - {token: mercury, name: Mercury}   # on Greenhouse, not Ashby
  # --- quant / trading ---
  - {token: janestreet, name: Jane Street}
  - {token: jumptrading, name: Jump Trading}
  - {token: imc, name: IMC Trading}
  - {token: point72, name: Point72}
  - {token: optiverus, name: Optiver}   # not `optiver`: that board resolves and is empty
  # --- AI / ML ---
  - {token: anthropic, name: Anthropic}
  - {token: scaleai, name: Scale AI}
  - {token: databricks, name: Databricks}
  # --- robotics / autonomy (closest to the Merlin Drones work) ---
  - {token: waymo, name: Waymo}
  - {token: nuro, name: Nuro}
  - {token: andurilindustries, name: Anduril}
  - {token: samsara, name: Samsara}
  - {token: verkada, name: Verkada}
  # --- infrastructure / developer tools ---
