name: Daily internship digest

# GitHub's scheduler is UTC-only, so hitting 3pm local year-round takes two
# entries plus a guard. One fires during CDT, the other during CST; the guard
# below exits the run that is an hour off, so exactly one proceeds on any given
# day. A single UTC cron would drift by an hour twice a year.
on:
  schedule:
    - cron: '0 20 * * *'   # 15:00 America/Chicago while CDT
    - cron: '0 21 * * *'   # 15:00 America/Chicago while CST
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'How far back to look (hours)'
        required: false
        default: '24'
      top_n:
        description: 'How many postings get tailored documents'
        required: false
        default: '8'
      dry_run:
        description: 'Build everything but send nothing'
        type: boolean
        required: false
        default: false

concurrency:
  # Never let two digests run at once: they would each see the postings as
  # unsent and both send them.
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Is this the run that should send today's digest?
        id: clock
        env:
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
          EVENT_NAME: ${{ github.event_name }}
          FIRED_CRON: ${{ github.event.schedule }}
          THIS_RUN: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TZONE="${DIGEST_TIMEZONE:-America/Chicago}"
          echo "local time: $(TZ="$TZONE" date '+%F %H:%M %Z')"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual run - proceeding"
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Which of the two crons is 3pm local *today*? Derived rather than
          # hardcoded, so this stays right across a DST change and if
          # DIGEST_TIMEZONE is ever repointed.
          WANT=""
          for H in 20 21; do
            if [ "$(TZ="$TZONE" date -d "today ${H}:00 UTC" +%H)" = "15" ]; then
              WANT="0 ${H} * * *"
            fi
          done
          # Neither lands on 3pm (a timezone this pair was not written for).
          # Pick the earlier one rather than never running at all.
          [ -z "$WANT" ] && WANT="0 20 * * *"
          echo "cron: fired='${FIRED_CRON}' authoritative-today='${WANT}'"

          if [ "$FIRED_CRON" = "$WANT" ]; then
            # Deliberately no check on the current hour. GitHub's scheduler is
            # best-effort: on 2026-08-26 this cron was dropped outright and its
            # partner arrived 2h41m late, so an exact "is it 15:00" test failed
            # and the day was skipped silently. The cron that fired is the one
            # that was scheduled, however late it actually got here.
            echo "authoritative cron - proceeding"
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # The off-season cron. Normally it stops here. But if the
          # authoritative one never arrived, this is the day's only chance, so
          # proceed when no run in the last 8 hours actually reached the digest
          # step (a guard-exit leaves that step "skipped", which does not count).
          echo "off-season cron - checking whether today's digest already ran"
          CUTOFF=$(date -u -d '8 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          ALREADY=no
          for ID in $(gh run list --repo "$GH_REPO" --workflow=daily-digest.yml \
                        --limit 30 --json databaseId,createdAt \
                        --jq "[.[] | select(.createdAt > \"$CUTOFF\")] | .[].databaseId" \
                      2>/dev/null); do
            [ "$ID" = "$THIS_RUN" ] && continue
            if gh run view "$ID" --repo "$GH_REPO" --json jobs \
                 --jq '.jobs[].steps[] | select(.name == "Run the digest") | .conclusion' \
                 2>/dev/null | grep -qv '^skipped$'; then
              ALREADY=yes; break
            fi
          done

          if [ "$ALREADY" = "yes" ]; then
            echo "today's digest already ran - stopping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            # Fails open: if the API calls above returned nothing, a duplicate
            # run is cheap (the sent-store suppresses every posting already
            # mailed) while a missed day is not.
            echo "no digest yet today - proceeding as catch-up"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.clock.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: System dependencies
        if: steps.clock.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          # poppler-utils: pdftotext, used by the render guardrails.
          # fonts-urw-base35: Nimbus Roman, metric-identical to the Times face
          #   in the master resume. Without it the rebuild silently falls back
          #   to a different face and the layout stops matching.
          sudo apt-get install -y -qq --no-install-recommends \
            poppler-utils fonts-urw-base35 \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2

      - name: Python dependencies
        if: steps.clock.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the seen/sent database
        if: steps.clock.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          # Without this every run starts blank, every posting looks new, and
          # the same jobs are emailed again the next day.
          path: internships.db
          key: digest-db-${{ github.run_id }}
          restore-keys: |
            digest-db-

      - name: Restore the profile
        if: steps.clock.outputs.go == 'true'
        env:
          PROFILE_YML: ${{ secrets.PROFILE_YML }}
          MASTER_PDF_B64: ${{ secrets.MASTER_PDF_B64 }}
        run: |
          # profile/ is git-ignored - it holds a real phone number and address -
          # so it arrives as secrets rather than living in the repository.
          mkdir -p profile
          printf '%s' "$PROFILE_YML" > profile/profile.yml
          if [ -n "$MASTER_PDF_B64" ]; then
            printf '%s' "$MASTER_PDF_B64" | base64 -d > profile/master.pdf
          fi
          test -s profile/profile.yml || { echo "PROFILE_YML secret is empty"; exit 1; }

      - name: Pre-flight
        if: steps.clock.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python main.py --doctor

      - name: Run the digest
        if: steps.clock.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # `||` supplies the fallback here because an undefined repository
          # variable expands to the empty string rather than being omitted,
          # and an empty MODEL_* reaches the API as model="" - a 400 on every
          # call. config.py also treats blank as unset, so this is the second
          # of two independent guards against the same mistake.
          MODEL_SCORING: ${{ vars.MODEL_SCORING || 'claude-opus-5' }}
          MODEL_TAILORING: ${{ vars.MODEL_TAILORING || 'claude-sonnet-5' }}
          MODEL_LETTER: ${{ vars.MODEL_LETTER || 'claude-opus-5' }}
          MODEL_RESEARCH: ${{ vars.MODEL_RESEARCH || 'claude-haiku-4-5' }}
          # A ceiling for runaway bugs, not a target. Hitting it is not
          # graceful: calls are refused from that point on, so the last
          # companies in a run get an untailored resume and no cover letter
          # while the first ones got both.
          #
          # Held at 2.50 through the change that dropped the voice revision
          # and moved resume tailoring to Sonnet. Those should take a
          # ten-company day well under a dollar, but that is a projection, and
          # projections have been wrong about this pipeline twice. Revisit
          # once a few untouched days are on the ledger.
          #
          # Set the DAILY_BUDGET_USD repository variable to override for a
          # single day - e.g. when a day's verification runs have already
          # spent against the same UTC-day total. Delete it to fall back here.
          DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD || '2.50' }}
        run: |
          ARGS="--digest"
          [ -n "${{ inputs.window_hours }}" ] && ARGS="$ARGS --window ${{ inputs.window_hours }}"
          [ -n "${{ inputs.top_n }}" ] && ARGS="$ARGS --top ${{ inputs.top_n }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python main.py $ARGS

      - name: Save the seen/sent database
        # `always()`: if the send failed, the postings are deliberately still
        # unrecorded, and that state must persist so tomorrow retries them.
        if: always() && steps.clock.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: internships.db
          key: digest-db-${{ github.run_id }}

      - name: Keep the generated documents
        if: always() && steps.clock.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
